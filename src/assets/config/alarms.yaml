MeteoStation:
   precipitation:
      alarms:
         - name: 'Heavy Rain (10min)'
           description: 'Heavy precipitation detected in last 10 minutes'
           priority: 'high'
           thresholds:
              min: 1
              max: 99999
           periods: [600]
   air_temperature:
      alarms:
         - name: 'Below Zero Air Temperature'
           description: 'Daily average temperature below freezing'
           priority: 'high'
           thresholds:
              min: -100
              max: -5
           periods: [600,900]
         # NOTE: example filter by origins: ['SIAG']
         # origins: ['SIAG']

         - name: 'High Temperature'
           description: 'Unusually high temperature'
           priority: 'medium'
           thresholds:
              min: 35
              max: 99999
           periods: [600,900]
           
EnvironmentStation:
   NO2-Alphasense_processed:
      alarms:
         - name: 'High NO2 Level (A22)'
           description: 'Nitrogen dioxide levels are high'
           priority: 'high'
           thresholds:
              min: 40
              max: 99999
           periods: [3600]
           origins: ['a22-algorab']
   NO2 - Ossidi di azoto:
      alarms:
        - name: 'High NO2 Level (APPABZ)'
           description: 'Nitrogen dioxide levels are high'
           priority: 'high'
           thresholds:
              min: 40
              max: 99999
           periods: [3600]
           origins: ['APPABZ']
   nitrogen-dioxide:
      alarms:
        - name: 'High NO2 Level (APPATN)'
           description: 'Nitrogen dioxide levels are high'
           priority: 'high'
           thresholds:
              min: 40
              max: 99999
           periods: [3600]
           origins: ['APPATN-open']

RWISstation:
   temp_suolo:
      alarms:
         - name: 'Below Zero Road Temperature'
           description: 'Road surface temperature near freezing point'
           priority: 'high'
           thresholds:
              min: -100
              max: -3
           periods: [1]

TrafficSensor:
   average-speed-light-vehicles:
      alarms:
         - name: 'Slow Traffic'
           description: 'Traffic moving slower than normal'
           priority: 'high'
           thresholds:
              min: 0
              max: 50
           periods: [600]
           origins: ['A22']

ParkingStation:
   free:
      alarms:
         - name: 'Limited availability'
           description: 'Parking nearly fully occupied'
           priority: 'high'
           thresholds:
              min: 0
              max: 25
           periods: [300,600, 120]
